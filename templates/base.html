<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "HPC Dashboard" }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { overflow-x: hidden; }
        .sidebar {
            height: 100vh;
            background: #1e293b;
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 240px;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover {
            background: #334155;
            color: white;
        }
        .content {
            margin-left: 260px;
            padding: 25px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4 class="text-center mb-4">HPC Admin</h4>

    <a href="/">User Lookup</a>
    <a href="/projects">Projects</a>
    <a href="/partitions">Partitions</a>

</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
