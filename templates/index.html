<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Cheaha HPC Dashboard" }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { overflow-x: hidden; }
        .sidebar {
            height: 100vh;
            background: #036c46;
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 240px;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover {
            background: #b5bac1;
            color: white;
        }
        .content {
            margin-left: 260px;
            padding: 25px;
        }
    </style>
</head>

<body>

<!-- Static sidebar navigation menues for all dashboard pages -->
<div class="sidebar">
    <h4 class="text-center mb-4">Cheaha Dashboard</h4>

    <a href="/">User Information</a>
    <a href="/projects">Projects</a>
    <a href="/partitions">Partitions</a>

</div>

 <!-- the jinja block tells the child html templates to insert their page content here (i.e it is dynamic) -->
<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
